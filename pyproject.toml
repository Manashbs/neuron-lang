[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-lang"
version = "1.1.0"
description = "AI-first programming language with static tensor analysis and an OpenQASM 3 compiler"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["numpy>=1.21.0"]

[project.optional-dependencies]
full = ["matplotlib>=3.5.0", "Pillow>=9.0.0"]

[project.scripts]
neuron = "neuron.main:main"

[tool.setuptools]
packages = ["neuron", "neuron.stdlib", "neuron.utils"]
